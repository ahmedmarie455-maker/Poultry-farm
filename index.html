    function compressPhotoFile(file, cb) {
      if (!file || !file.type.startsWith('image/')) return cb('');
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const maxW = 900;
          const scale = Math.min(1, maxW / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          cb(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveToIndexedDB(data) {
      try {
        if (!('indexedDB' in window)) return;
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains(IDB_STORE)) e.target.result.createObjectStore(IDB_STORE); };
        req.onsuccess = e => { e.target.result.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(data, 'latest'); };
      } catch (_) {}
    }
    function loadFromIndexedDB() {
      return new Promise(res => {
        try {
          if (!('indexedDB' in window)) return res(null);
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains(IDB_STORE)) e.target.result.createObjectStore(IDB_STORE); };
          req.onsuccess = e => {
            const g = e.target.result.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get('latest');
            g.onsuccess = () => res(g.result || null); g.onerror = () => res(null);
          };
          req.onerror = () => res(null);
        } catch (_) { res(null); }
      });
    }

    function getCycleStats(c) {
      if (!c) return { dead: 0, soldBirds: 0, soldWeightKg: 0, alive: 0, mortPct: 0, feedKg: 0, waterLiters: 0, avgWeightG: 0, biomassKg: 0, fcr: 0, epef: 0, ageDays: 0, salesTotal: 0, directCosts: 0, costPerKg: 0, netProfit: 0 };
      const logs = c.logs || [];
      const dead = logs.reduce((s, l) => s + Number(l.mortality || 0), 0);
      const feedKg = logs.reduce((s, l) => s + Number(l.feedKg || 0), 0);
      const waterLiters = logs.reduce((s, l) => s + Number(l.waterLiters || 0), 0);
      const lastWtLog = [...logs].reverse().find(l => Number(l.avgWeightG || 0) > 0);
      const avgWeightG = lastWtLog ? Number(lastWtLog.avgWeightG) : 45;
      const cycleSales = state.sales.filter(s => s.cycleId === c.id);
      const soldBirds = cycleSales.filter(s => s.saleType === 'لحم فراخ').reduce((s, x) => s + Number(x.birdsCount || 0), 0);
      const soldWeightKg = cycleSales.filter(s => s.saleType === 'لحم فراخ').reduce((s, x) => s + Number(x.weightKg || 0), 0);
      const alive = Math.max(0, Number(c.initialCount || 0) - dead - soldBirds);
      const mortPct = c.initialCount > 0 ? (dead / c.initialCount) * 100 : 0;
      const livabilityPct = Math.max(0, 100 - mortPct);
      const biomassKg = ((alive * avgWeightG) / 1000) + soldWeightKg;
      const fcr = biomassKg > 0 ? feedKg / biomassKg : 0;
      const ageDays = Math.max(1, Math.floor((new Date() - new Date(c.startDate + 'T00:00:00')) / 86400000) + 1);
      const avgWeightKg = avgWeightG / 1000;
      const epef = (fcr > 0 && ageDays > 0) ? ((livabilityPct * avgWeightKg) / (fcr * ageDays)) * 100 : 0;

      const salesTotal = cycleSales.reduce((s, x) => s + Number(x.total || 0), 0)
        + state.revenues.filter(r => r.cycleId === c.id).reduce((s, x) => s + Number(x.amount || 0), 0);
      const purchasesTotal = state.purchases.filter(p => p.cycleId === c.id).reduce((s, x) => s + Number(x.total || 0), 0);
      const expensesTotal = state.expenses.filter(e => e.cycleId === c.id).reduce((s, x) => s + Number(x.amount || 0), 0);
      const directCosts = purchasesTotal + expensesTotal;
      const costPerKg = biomassKg > 0 ? directCosts / biomassKg : 0;
      return { dead, soldBirds, soldWeightKg, alive, mortPct, feedKg, waterLiters, avgWeightG, biomassKg, fcr, epef, ageDays, salesTotal, directCosts, costPerKg, netProfit: salesTotal - directCosts };
    }

    function getTreasuryBalance(id) {
      const tr = state.treasuries.find(t => t.id === id); if (!tr) return 0;
      return Number(tr.openingBalance || 0) + state.treasuryTx.filter(x => x.treasuryId === id)
        .reduce((s, x) => s + (['قبض','إيداع','تحويل وارد'].includes(x.type) ? Number(x.amount) : -Number(x.amount)), 0);
    }
    function getTotalTreasuryBalance() { return state.treasuries.reduce((s, t) => s + getTreasuryBalance(t.id), 0); }
    function getBankBalance(id) {
      const b = state.banks.find(x => x.id === id); if (!b) return 0;
      return Number(b.openingBalance || 0) + state.bankTx.filter(x => x.bankId === id)
        .reduce((s, x) => s + (['إيداع','تحويل وارد'].includes(x.type) ? Number(x.amount) : -Number(x.amount)), 0);
    }
    function getTotalBankBalance() { return state.banks.reduce((s, b) => s + getBankBalance(b.id), 0); }
    function getTotalStockValue() { return state.items.reduce((s, i) => s + (Number(i.qty || 0) * Number(i.unitCost || 0)), 0); }
    function getSupplierBalance(id) {
      const sup = state.suppliers.find(s => s.id === id); if (!sup) return 0;
      return Number(sup.openingBalance || 0) + state.purchases.filter(p => p.supplierId === id).reduce((s, p) => s + Number(p.remaining || 0), 0) - Number(sup.advance || 0);
    }
    function getTotalSuppliersBalance() { return state.suppliers.reduce((s, x) => s + Math.max(0, getSupplierBalance(x.id)), 0); }
    function getCustomerBalance(id) {
      const cus = state.customers.find(c => c.id === id); if (!cus) return 0;
      return Number(cus.openingBalance || 0) + state.sales.filter(s => s.customerId === id).reduce((s, x) => s + Number(x.remaining || 0), 0) - Number(cus.advance || 0);
    }
    function getTotalCustomersBalance() { return state.customers.reduce((s, x) => s + Math.max(0, getCustomerBalance(x.id)), 0); }
    function getPartnerSummary(partnerId) {
      const txs = state.partnerTx.filter(t => t.partnerId === partnerId);
      const capitalCash = txs.filter(t => t.type === 'إيداع رأس مال بالخزنة').reduce((s, x) => s + Number(x.amount || 0), 0);
      const directPay = txs.filter(t => t.type === 'دفع مباشر من جيب الشريك').reduce((s, x) => s + Number(x.amount || 0), 0);
      const deposit = txs.filter(t => t.type === 'تأمين مسترد').reduce((s, x) => s + Number(x.amount || 0), 0);
      const withdrawals = txs.filter(t => t.type === 'مسحوبات شريك').reduce((s, x) => s + Number(x.amount || 0), 0);
      return { capitalCash, directPay, deposit, withdrawals, operatingEquity: capitalCash + directPay - withdrawals };
    }
    function getPendingChequesTotal() {
      const inP = state.chequesIn.filter(c => c.status !== 'تم تحصيله').reduce((s, c) => s + Number(c.amount || 0), 0);
      const outP = state.chequesOut.filter(c => c.status !== 'تم صرفه').reduce((s, c) => s + Number(c.amount || 0), 0);
      return { inPending: inP, outPending: outP, total: inP + outP };
    }
    function getTotalsByPeriod(period = 'all') {
      const now = new Date();
      const inP = (ds) => {
        if (!ds || period === 'all') return true;
        const d = new Date(ds + 'T00:00:00'); const diff = (now - d) / 86400000;
        if (period === 'daily') return ds === todayISO();
        if (period === 'weekly') return diff >= 0 && diff <= 7;
        if (period === 'monthly') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        if (period === 'yearly') return d.getFullYear() === now.getFullYear();
        return true;
      };
      const totalSales = state.sales.filter(x => inP(x.date)).reduce((s, x) => s + Number(x.total || 0), 0);
      const totalPurchases = state.purchases.filter(x => inP(x.date)).reduce((s, x) => s + Number(x.total || 0), 0);
      const totalExpenses = state.expenses.filter(x => inP(x.date)).reduce((s, x) => s + Number(x.amount || 0), 0)
        + state.dailyLabor.filter(x => inP(x.date)).reduce((s, x) => s + Number(x.total || 0), 0);
      const totalOtherRevenues = state.revenues.filter(x => inP(x.date)).reduce((s, x) => s + Number(x.amount || 0), 0);
      return { totalSales, totalPurchases, totalExpenses, totalOtherRevenues, netProfit: (totalSales + totalOtherRevenues) - (totalPurchases + totalExpenses) };
    }

            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800"><div class="text-xs text-slate-500">الحي / المسكن</div><div class="font-extrabold text-sm text-emerald-700 dark:text-emerald-300 mt-1 num">${fmtNum(st.alive,0)} / ${fmtNum(c.initialCount,0)}</div></div>
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800"><div class="text-xs text-slate-500">النافق (%)</div><div class="font-extrabold text-sm text-red-600 mt-1 num">${fmtNum(st.dead,0)} (${fmtNum(st.mortPct,2)}%)</div></div>
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800"><div class="text-xs text-slate-500">FCR / EPEF</div><div class="font-extrabold text-sm text-blue-700 dark:text-blue-300 mt-1 num">${fmtNum(st.fcr,2)} • ${fmtNum(st.epef,0)}</div></div>

              <button onclick="copyWhatsAppSummary('${c.id}')" class="px-3 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-brand-700 dark:text-emerald-300 text-xs font-bold">نسخ ملخص واتساب</button>
              <button onclick="openSettlementModal('${c.id}')" class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">كشف تصفية الدورة</button>
              ${can('add') && !c.locked ? `<button onclick="openDailyLogModal('${c.id}')" class="px-3 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">+ يومية عنبر</button>` : ''}
              ${can('edit') && !c.locked ? `<button onclick="lockCycle('${c.id}')" class="px-3 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">قفل وتصفية</button>` : ''}

              ${!(c.vaccines||[]).length ? '<div class="text-slate-400">لا توجد تحصينات مضافة</div>' : c.vaccines.map((v, idx) => `<label class="flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-800 cursor-pointer"><span class="flex items-center gap-2"><input type="checkbox" ${v.done?'checked':''} onchange="toggleVaccine('${c.id}',${idx})" class="accent-brand-600" /><strong>${esc(v.name)}</strong></span><span class="num text-slate-500">يوم ${v.day}</span></label>`).join('')}

    function openCycleModal() {
      openModal('إضافة دورة فراخ جديدة', `
        <form onsubmit="saveCycle(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div><label class="block font-bold mb-1">اسم الدورة *</label><input id="cyc-name" required placeholder="مثال: دورة ديسمبر 2026" class="w-full rounded-xl border bg-slate-50 dark:bg-slate-800 px-3 py-2 font-bold" /></div>
          <div><label class="block font-bold mb-1">السلالة</label><input id="cyc-breed" value="كب (Cobb 500)" class="w-full rounded-xl border bg-slate-50 dark:bg-slate-800 px-3 py-2 font-bold" /></div>
          <div><label class="block font-bold mb-1">تاريخ التسكين *</label><input type="date" id="cyc-date" value="${todayISO()}" required class="w-full rounded-xl border bg-slate-50 dark:bg-slate-800 px-3 py-2 font-bold num" /></div>
          <div><label class="block font-bold mb-1">عدد الكتاكيت *</label><input type="number" id="cyc-cnt" value="5000" required class="w-full rounded-xl border bg-slate-50 dark:bg-slate-800 px-3 py-2 font-bold num" /></div>
          <div><label class="block font-bold mb-1">سعر الكتكوت (EGP)</label><input type="number" step="0.01" id="cyc-price" value="30" class="w-full rounded-xl border bg-slate-50 dark:bg-slate-800 px-3 py-2 font-bold num" /></div>
          <div><label class="block font-bold mb-1">ملاحظات</label><input id="cyc-notes" class="w-full rounded-xl border bg-slate-50 dark:bg-slate-800 px-3 py-2 font-bold" /></div>
          <div class="sm:col-span-2 flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-700 font-bold">إلغاء</button><button class="px-5 py-2 rounded-xl bg-brand-600 text-white font-bold">حفظ الدورة</button></div>
        </form>
      `);
    }
    function saveCycle(e) {
      e.preventDefault();
      const id = 'CYC-' + Date.now();
      state.cycles.unshift({ id, name: document.getElementById('cyc-name').value.trim(), breed: document.getElementById('cyc-breed').value.trim(), startDate: document.getElementById('cyc-date').value, initialCount: Number(document.getElementById('cyc-cnt').value||0), chickPrice: Number(document.getElementById('cyc-price').value||0), status: 'نشطة', locked: false, notes: document.getElementById('cyc-notes').value.trim(), vaccines: [{ day: 7, name: 'تحصين نيوكاسل', done: false }], checklist: DEFAULT_CHECKLIST.map((title, i) => ({ id: 'CHK-' + i, title, done: false })), logs: [] });
      selectedCycleId = id; logAudit('دورة جديدة', document.getElementById('cyc-name').value); saveState(); closeModal(); renderCycles(document.getElementById('app-content')); lucide.createIcons(); showToast('تم إنشاء الدورة بنجاح');
    }
    function toggleVaccine(cId, idx) { const c = state.cycles.find(x => x.id === cId); if (c?.vaccines?.[idx] && !c.locked) { c.vaccines[idx].done = !c.vaccines[idx].done; saveState(); } }
    function addVaccine(cId) {
      const name = prompt('اسم التحصين:'); if (!name) return;
      const day = Number(prompt('اليوم في الدورة (مثال 14):', '14') || 14);
      const c = state.cycles.find(x => x.id === cId); if (c) { c.vaccines = c.vaccines || []; c.vaccines.push({ name: name.trim(), day, done: false }); saveState(); renderCycles(document.getElementById('app-content')); lucide.createIcons(); }
    }
    function toggleChecklist(cId, idx) { const c = state.cycles.find(x => x.id === cId); if (c?.checklist?.[idx] && !c.locked) { c.checklist[idx].done = !c.checklist[idx].done; saveState(); } }
    function lockCycle(cId) {
      const c = state.cycles.find(x => x.id === cId); if (!c) return;
      if (!confirm('تأكيد إغلاق وقفل الدورة نهائيًا بعد التصفية؟')) return;
      c.status = 'مغلقة'; c.locked = true;
      logAudit('قفل دورة', c.name); saveState(); renderCycles(document.getElementById('app-content')); lucide.createIcons(); showToast('تم قفل الدورة بنجاح');
    }

    function copyWhatsAppSummary(cId) {
      const c = state.cycles.find(x => x.id === cId); if (!c) return;
      const st = getCycleStats(c);
      const msg = `*${state.settings.farmName}*
*${c.name}* (عمر ${st.ageDays} يوم)
• الطيور الحية: ${fmtNum(st.alive,0)}
• النافق: ${fmtNum(st.dead,0)} (${fmtNum(st.mortPct,2)}%)
• العلف: ${fmtNum(st.feedKg,1)} كجم | FCR: ${fmtNum(st.fcr,2)}
• متوسط الوزن: ${fmtNum(st.avgWeightG,0)} جم
• تكلفة الكيلو: ${fmtMoney(st.costPerKg)}`;
      navigator.clipboard.writeText(msg);
      showToast('تم نسخ ملخص الدورة للواتساب');
    }

    function openSettlementModal(cId) {
      const c = state.cycles.find(x => x.id === cId); if (!c) return;
      const st = getCycleStats(c);
      const rows = state.partners.map(p => {
        const sm = getPartnerSummary(p.id);
        const share = (st.netProfit * Number(p.sharePct || 0)) / 100;
        return `<tr class="border-b"><td class="p-2 font-bold">${esc(p.name)} (${p.sharePct}%)</td><td class="p-2 num">${fmtMoney(sm.operatingEquity)}</td><td class="p-2 num">${fmtMoney(share)}</td><td class="p-2 num font-extrabold">${fmtMoney(sm.operatingEquity + share)}</td></tr>`;

      </div>`);

      container.innerHTML = `<div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 flex justify-between items-center no-print"><div class="text-xs font-bold">إجمالي الإيرادات الأخرى: <strong class="text-brand-700 num">${fmtMoney(state.revenues.reduce((s,x)=>s+Number(x.amount||0),0))}</strong></div>${can('add')?`<button onclick="openRevModal()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">+ تسجيل إيراد</button>`:''}</div><div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"><table class="w-full text-xs text-right"><thead class="bg-slate-100 dark:bg-slate-800 font-bold"><tr><th class="p-3">التاريخ</th><th class="p-3">البيان</th><th class="p-3">المبلغ</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">${!state.revenues.length?'<tr><td colspan="3" class="p-6 text-center text-slate-400">لا توجد إيرادات إضافية</td></tr>':state.revenues.map(r=>`<tr><td class="p-3 num">${esc(r.date)}</td><td class="p-3 font-bold">${esc(r.name)}</td><td class="p-3 font-extrabold text-brand-700 num">${fmtMoney(r.amount)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    function openRevModal() {
      openModal('تسجيل إيراد آخر', `<form onsubmit="saveRev(event)" class="space-y-3 text-xs"><div><label class="block font-bold mb-1">اسم الإيراد *</label><input id="rv-name" required class="w-full rounded-xl border bg-slate-50 dark:bg-slate-800 px-3 py-2" /></div><div><label class="block font-bold mb-1">المبلغ (EGP) *</label><input type="number" step="0.01" id="rv-amt" required class="w-full rounded-xl border bg-slate-50 dark:bg-slate-800 px-3 py-2 num" /></div><div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-700">إلغاء</button><button class="px-5 py-2 rounded-xl bg-brand-600 text-white font-bold">حفظ</button></div></form>`);
    }
    function saveRev(e) {
      e.preventDefault(); const id = 'REV-'+Date.now(), name = document.getElementById('rv-name').value.trim(), amount = Number(document.getElementById('rv-amt').value||0);
      state.revenues.unshift({ id, date: todayISO(), name, amount });
      if (state.treasuries[0]) state.treasuryTx.unshift({ id: 'TTX-'+Date.now(), date: todayISO(), treasuryId: state.treasuries[0].id, type: 'قبض', amount, party: 'إيراد', ref: id, notes: name });
      saveState(); closeModal(); renderRevenues(document.getElementById('app-content')); lucide.createIcons(); showToast('تم تسجيل الإيراد');
    }

    function renderTreasury(container) {
      container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-3">${state.treasuries.map(t=>`<div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800"><div class="font-bold text-sm">${esc(t.name)}</div><div class="text-xl font-extrabold text-brand-700 mt-1 num">${fmtMoney(getTreasuryBalance(t.id))}</div></div>`).join('')}</div>
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"><table class="w-full text-xs text-right"><thead class="bg-slate-100 dark:bg-slate-800 font-bold"><tr><th class="p-3">التاريخ</th><th class="p-3">النوع</th><th class="p-3">البيان</th><th class="p-3">المبلغ</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">${state.treasuryTx.map(tx=>`<tr><td class="p-3 num">${esc(tx.date)}</td><td class="p-3 font-bold ${tx.type==='قبض'?'text-brand-700':'text-rose-600'}">${esc(tx.type)}</td><td class="p-3">${esc(tx.party||'')} • ${esc(tx.notes||'')}</td><td class="p-3 font-extrabold num">${fmtMoney(tx.amount)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    function renderBanks(container) {
      container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-3">${state.banks.map(b=>`<div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800"><div class="font-bold text-sm">${esc(b.bankName)}</div><div class="text-xs text-slate-500">${esc(b.accountName)}</div><div class="text-xl font-extrabold text-cyan-700 mt-1 num">${fmtMoney(getBankBalance(b.id))}</div></div>`).join('')}</div>
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"><table class="w-full text-xs text-right"><thead class="bg-slate-100 dark:bg-slate-800 font-bold"><tr><th class="p-3">التاريخ</th><th class="p-3">النوع</th><th class="p-3">البيان</th><th class="p-3">المبلغ</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">${state.bankTx.map(tx=>`<tr><td class="p-3 num">${esc(tx.date)}</td><td class="p-3 font-bold">${esc(tx.type)}</td><td class="p-3">${esc(tx.party||'')} • ${esc(tx.notes||'')}</td><td class="p-3 font-extrabold num">${fmtMoney(tx.amount)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    function renderCheques(container) {
      const ch = getPendingChequesTotal();
      container.innerHTML = `<div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 text-xs font-bold flex gap-6"><span>شيكات واردة معلقة: <strong class="text-emerald-700 num">${fmtMoney(ch.inPending)}</strong></span><span>شيكات صادرة معلقة: <strong class="text-rose-700 num">${fmtMoney(ch.outPending)}</strong></span></div>`;
    }
    function renderHR(container) {
      container.innerHTML = `<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"><table class="w-full text-xs text-right"><thead class="bg-slate-100 dark:bg-slate-800 font-bold"><tr><th class="p-3">الموظف</th><th class="p-3">الوظيفة</th><th class="p-3">الراتب</th><th class="p-3">السلف</th><th class="p-3">الصافي</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">${state.employees.map(e=>`<tr><td class="p-3 font-bold">${esc(e.name)}</td><td class="p-3">${esc(e.job)}</td><td class="p-3 num">${fmtMoney(e.salary)}</td><td class="p-3 num">${fmtMoney(e.advance)}</td><td class="p-3 font-extrabold text-brand-700 num">${fmtMoney(e.salary-e.advance)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    function renderSimpleAccounts(container) {
      const t = getTotalsByPeriod('all');
      const rows = [['رصيد الخزنة', getTotalTreasuryBalance()], ['رصيد البنوك', getTotalBankBalance()], ['قيمة المخزون', getTotalStockValue()], ['مديونية العملاء', getTotalCustomersBalance()], ['مديونية الموردين', getTotalSuppliersBalance()], ['إجمالي المبيعات', t.totalSales], ['إجمالي المشتريات', t.totalPurchases], ['إجمالي المصروفات', t.totalExpenses], ['صافي الربح / الخسارة', t.netProfit]];
      container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${rows.map(([l,v])=>`<div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800"><div class="text-xs text-slate-500 font-bold">${l}</div><div class="text-xl font-extrabold mt-1 num">${fmtMoney(v)}</div></div>`).join('')}</div>`;
    }
    function renderReports(container) {
      const t = getTotalsByPeriod('all');
      const rows = [['إجمالي المبيعات', t.totalSales], ['الإيرادات الأخرى', t.totalOtherRevenues], ['إجمالي المشتريات', t.totalPurchases], ['إجمالي المصروفات', t.totalExpenses], ['صافي الربح / الخسارة', t.netProfit]];
      container.innerHTML = `<div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 flex justify-between items-center no-print"><span class="font-bold text-sm">تقرير الأرباح والخسائر العام</span><button onclick="window.print()" class="px-4 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">طباعة / PDF</button></div><div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"><table class="w-full text-xs text-right"><thead class="bg-slate-100 dark:bg-slate-800 font-bold"><tr><th class="p-3">البند</th><th class="p-3">القيمة (EGP)</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">${rows.map(([l,v])=>`<tr><td class="p-3 font-bold">${l}</td><td class="p-3 font-extrabold num">${fmtMoney(v)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    function renderUsers(container) {
      container.innerHTML = `<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"><table class="w-full text-xs text-right"><thead class="bg-slate-100 dark:bg-slate-800 font-bold"><tr><th class="p-3">الاسم</th><th class="p-3">اسم الدخول</th><th class="p-3">الدور</th><th class="p-3">الحالة</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">${state.users.map(u=>`<tr><td class="p-3 font-bold">${esc(u.name)}</td><td class="p-3 num">${esc(u.username)}</td><td class="p-3">${esc(u.role)}</td><td class="p-3">${u.active?'نشط':'موقوف'}</td></tr>`).join('')}</tbody></table></div>`;
    }

    const APPS_SCRIPT_SNIPPET = `function doPost(e) {
  var folder = DriveApp.getRootFolder();
  var fileName = "Mar3y_Poultry_Farm_Backup.json";
  var files = folder.getFilesByName(fileName);
  var content = e.postData.contents;
  if (files.hasNext()) { files.next().setContent(content); }
  else { folder.createFile(fileName, content, MimeType.PLAIN_TEXT); }
  return ContentService.createTextOutput("OK");
}

function doGet(e) {
  var folder = DriveApp.getRootFolder();
  var fileName = "Mar3y_Poultry_Farm_Backup.json";
  var files = folder.getFilesByName(fileName);
  var out = files.hasNext() ? files.next().getBlob().getDataAsString() : "{}";
  return ContentService.createTextOutput(out).setMimeType(ContentService.MimeType.JSON);
}`;

    function renderSettings(container) {
      container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 space-y-4">
            <h3 class="font-extrabold text-sm flex items-center gap-2"><i data-lucide="cloud" class="w-4 h-4 text-brand-600"></i> النسخ الاحتياطي السحابي التلقائي (Google Drive)</h3>
            <p class="text-xs text-slate-500">اربط البرنامج بحساب Google Drive بتاعك عشان يحفظ نسخة احتياطية أوتوماتيك مع كل تعديل من غير ما تدوس أي زرار، ويقدر يسحب آخر نسخة على أي جهاز.</p>
            <div class="space-y-3 text-xs">
              <div><label class="block font-bold mb-1">رابط Google Apps Script Web App URL</label><input id="set-webhook" value="${esc(state.settings.cloudWebhookUrl||'')}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full rounded-xl border bg-slate-50 dark:bg-slate-800 px-3 py-2 num" /></div>
              <label class="flex items-center gap-2 font-bold cursor-pointer"><input type="checkbox" id="set-autosync" ${state.settings.cloudAutoSync?'checked':''} class="w-4 h-4 accent-brand-600" /> تفعيل الحفظ السحابي التلقائي مع كل تعديل</label>
              <div class="flex flex-wrap gap-2">
                <button onclick="saveCloudSettings()" class="px-4 py-2 rounded-xl bg-brand-600 text-white font-bold">حفظ إعدادات السحابة</button>
                <button onclick="manualCloudSync()" class="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold">رفع نسخة الآن</button>
                <button onclick="pullCloudBackup()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold">سحب نسخة من السحابة</button>
                <button onclick="copyAppsScript()" class="px-4 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-brand-700 dark:text-emerald-300 font-bold">نسخ كود Google Apps Script</button>
              </div>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 space-y-4">
            <h3 class="font-extrabold text-sm">النسخ الاحتياطي اليدوي وإدارة البيانات</h3>
            <div class="flex flex-wrap gap-2 text-xs">
              <button onclick="exportBackupJSON()" class="px-4 py-2.5 rounded-xl bg-brand-600 text-white font-bold">تنزيل نسخة احتياطية (JSON)</button>
              <label class="px-4 py-2.5 rounded-xl bg-slate-800 text-white font-bold cursor-pointer">استعادة نسخة (JSON)<input type="file" accept=".json" onchange="importBackupJSON(event)" class="hidden" /></label>
              <button onclick="resetEmptyDB()" class="px-4 py-2.5 rounded-xl bg-red-600 text-white font-bold">تصفير البرنامج للبدء الفعلي</button>
            </div>
          </div>
        </div>
      `;
    }
    function saveCloudSettings() {
      state.settings.cloudWebhookUrl = document.getElementById('set-webhook').value.trim();
      state.settings.cloudAutoSync = document.getElementById('set-autosync').checked;
      saveState(); updateCloudBadge(state.settings.cloudWebhookUrl ? 'السحابة متصلة' : 'حفظ محلي نشط'); showToast('تم حفظ إعدادات النسخ السحابي');
    }
    function copyAppsScript() { navigator.clipboard.writeText(APPS_SCRIPT_SNIPPET); showToast('تم نسخ كود Google Apps Script'); }
    function exportBackupJSON() {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
      a.download = `Mar3y_Poultry_Farm_Backup_${todayISO()}.json`; a.click(); showToast('تم تنزيل النسخة الاحتياطية');
    }
    function importBackupJSON(e) {
      const f = e.target.files?.[0]; if (!f) return;
      const r = new FileReader(); r.onload = ev => { try { state = JSON.parse(ev.target.result); saveState(); renderCurrentSection(); showToast('تم استعادة البيانات بنجاح'); } catch (_) { showToast('ملف غير صالح', 'error'); } }; r.readAsText(f);
    }
    function resetEmptyDB() {
      if (!confirm('هل أنت متأكد من مسح البيانات التجريبية والبدء بقاعدة بيانات فارغة؟')) return;
      state = createEmptyDatabase(); saveState(); renderCurrentSection(); showToast('تم تصفير البيانات بنجاح');
    }

    initDatabase().then(() => { renderQuickUsers(); lucide.createIcons(); });
  </script>
</body>
</html>
